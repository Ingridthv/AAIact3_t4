<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Lista de Alumnos</h2>

<a href="/alumnos/nuevo" class="btn btn-primary mb-3">Nuevo Alumno</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Escuela</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="a : ${alumnos}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.nombre}"></td>
            <td th:text="${a.edad}"></td>
            <td th:text="${a.escuela != null ? a.escuela.nombre : 'Sin escuela'}"></td>
            <td>
                <a th:href="@{/alumnos/editar/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/alumnos/eliminar/{id}(id=${a.id})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
