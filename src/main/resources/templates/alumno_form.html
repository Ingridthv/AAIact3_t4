<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Alumno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Formulario Alumno</h2>

<form th:action="@{/alumnos/guardar}" th:object="${alumno}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" th:field="*{nombre}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Edad</label>
        <input type="number" th:field="*{edad}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label>Escuela</label>
        <select th:field="*{escuela.id}" class="form-select" required>
            <option th:each="e : ${escuelas}" th:value="${e.id}" th:text="${e.nombre}"></option>
        </select>
    </div>

    <button class="btn btn-success">Guardar</button>
    <a href="/alumnos" class="btn btn-secondary">Cancelar</a>

</form>

</body>
</html>
